spring.application.name=service-a
server.port=9000

service-a.issuer=${SERVICE_A_ISSUER:http://localhost:9000}
service-a.audiences.service-a=${SERVICE_A_AUDIENCE_A:service-a}
service-a.audiences.service-b=${SERVICE_A_AUDIENCE_B:service-b}

service-a.keys.private-key-pem=${SERVICE_A_PRIVATE_KEY_PEM:}
service-a.keys.public-key-pem=${SERVICE_A_PUBLIC_KEY_PEM:}
service-a.keys.private-key-path=${SERVICE_A_PRIVATE_KEY_PATH:}
service-a.keys.public-key-path=${SERVICE_A_PUBLIC_KEY_PATH:}
service-a.keys.key-id=${SERVICE_A_KEY_ID:service-a-key}

service-a.seed.pkce-client-id=${SERVICE_A_PKCE_CLIENT_ID:pkce-client}
service-a.seed.pkce-redirect-uri=${SERVICE_A_PKCE_REDIRECT_URI:http://127.0.0.1:8085/callback}
service-a.seed.internal-client-id=${SERVICE_A_INTERNAL_CLIENT_ID:internal-client}
service-a.seed.internal-client-secret=${SERVICE_A_INTERNAL_CLIENT_SECRET:internal-secret}
service-a.seed.demo-user=${SERVICE_A_DEMO_USER:demo}
service-a.seed.demo-password=${SERVICE_A_DEMO_PASSWORD:demo1234}
service-a.custom-login.token-ttl-minutes=${SERVICE_A_CUSTOM_LOGIN_TOKEN_TTL_MINUTES:10}

spring.datasource.url=${SERVICE_A_DB_URL:jdbc:postgresql://localhost:5432/service_a}
spring.datasource.username=${SERVICE_A_DB_USERNAME:postgres}
spring.datasource.password=${SERVICE_A_DB_PASSWORD:1234}
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
