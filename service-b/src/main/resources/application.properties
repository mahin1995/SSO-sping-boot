spring.application.name=service-b
server.port=9001

service-b.jwt.issuer=${SERVICE_A_ISSUER:http://localhost:9000}
service-b.jwt.jwk-set-uri=${SERVICE_A_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}
service-b.audience=${SERVICE_B_AUDIENCE:service-b}
service-b.allowed-jws-algorithm=${SERVICE_B_ALLOWED_JWS_ALGORITHM:RS256}
app.cors.allowed-origins=${SERVICE_B_CORS_ALLOWED_ORIGINS:http://127.0.0.1:8085,http://localhost:8085}

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
